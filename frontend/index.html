<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e7f4ff" />
    <meta
      name="description"
      content="Jelajahi Nusantara bersama teman atau enam persona AI: RAKA, BIMA, SARI, NUSA, ARKA dan KRESNA. Permainan properti 40 petak, dengan room persisten dan mata uang Nusa."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'"
    />
    <title>Nusantara — Jelajah · Miliki · Bangun</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/assets/brand/favicon.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/brand/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nusantara" />
    <link rel="stylesheet" href="/frontend/styles.css" />
  </head>
  <body>
    <div id="page"></div>
    <dialog id="popup" class="popup" aria-modal="true">
      <button
        class="popup-close"
        type="button"
        data-action="close"
        aria-label="Tutup popup"
      >
        <svg
          class="ui-icon lucide-icon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="m6 6 12 12M18 6 6 18" />
        </svg>
      </button>
      <header class="popup-header" hidden></header>
      <section class="popup-body"></section>
      <footer class="popup-footer"></footer>
    </dialog>
    <noscript
      ><p class="no-script">
        Aktifkan JavaScript untuk bermain Nusantara.
      </p></noscript
    >
    <script type="module" src="/frontend/app.mjs"></script>
  </body>
</html>
